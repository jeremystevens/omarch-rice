# NEXUS scratch terminal (tmux -L nexus-scratch). Your normal tmux setup first,
# so keys and look match; then the scratch-only additions. This server is
# separate from your other tmux sessions, so nothing here affects them.
source-file -q ~/.config/tmux/tmux.conf

# Escape hides the scratch terminal, but only when the shell itself is in
# front: inside nvim, less, htop, fzf, copy mode or any other program, Escape
# goes to that program as usual. Turn it off in tmux.local.conf with
#   set -g @nexus_esc_hides off
set -g @nexus_esc_hides on
set -sg escape-time 10
bind -n Escape if -F "#{&&:#{==:#{@nexus_esc_hides},on},#{&&:#{m/r:^(bash|zsh|fish|sh|dash)$,#{pane_current_command}},#{!=:#{pane_in_mode},1}}}" \
  "run-shell -b '~/.config/nexus/bin/nexus-scratch hide'" \
  "send-keys Escape"

source-file -q ~/.config/nexus/scratch/tmux.local.conf
