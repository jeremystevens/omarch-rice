# keyd: the keys the Acer Chromebook Spin 13 keyboard doesn't have, on a right-Alt layer.
# Installed to /etc/keyd/default.conf by `bootstrap.sh keyd`; apply edits with `sudo keyd reload`.
#
#   right Alt + Backspace   Delete
#   right Alt + ← / →       Home / End
#   right Alt + ↑ / ↓       Page Up / Page Down
#   right Alt + - / =       F11 / F12
#
# Shift and Ctrl still combine (Shift + right Alt + → selects to the end of the line).
# Left Alt is unchanged. If the keyboard ever stops responding, press
# Backspace + Escape + Enter together: keyd quits and the normal keyboard comes back.

[ids]
# Only the built-in keyboard (not the touchscreen, touchpad or USB devices).
0001:0001

[main]
rightalt = layer(nav)

[nav]
backspace = delete
left = home
right = end
up = pageup
down = pagedown
minus = f11
equal = f12
