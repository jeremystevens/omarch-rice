# NEXUS: what the interface shows about you.
# Only what you write here is shown. Empty values stay hidden.
# Saving this file updates the rail and the command menu.

[identity]
name    = "NEXUS"
tagline = ""

# Projects appear in the rail and under `p` in the command menu.
# name = "path"   (~ is your home folder)
[projects]
omarch-rice = "~/omarch-rice"
tries       = "~/Work/tries"
